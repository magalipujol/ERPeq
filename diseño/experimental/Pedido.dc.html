<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pedido nuevo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F5DA8}a:hover{color:#1F4580}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F3EC; color: #1E2420; font-family: 'Lexend', Verdana, sans-serif; font-variant-numeric: tabular-nums; line-height: 1.5">

  <header style="height: 72px; padding: 0 12px; display: flex; align-items: center; gap: 8px">
    <a href="Main.dc.html" aria-label="Volver" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1E2420" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <span style="width: 36px; height: 36px; border-radius: 12px; background: #2F5DA8; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"></rect><path d="M9 4h6v3H9z"></path><path d="M12 11v6M9 14h6"></path></svg>
    </span>
    <h1 style="margin: 0; font-size: 22px; font-weight: 600">Pedido</h1>
  </header>

  <div style="padding: 0 20px; display: flex; flex-direction: column; gap: 10px">
    <button type="button" style="border: 0; text-align: left; background: #FFFDF8; color: inherit; border-radius: 18px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; min-height: 64px; box-shadow: 0 1px 0 #E5E0D3">
      <span style="width: 44px; height: 44px; border-radius: 22px; background: #E3EBF7; color: #1F4580; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center">DS</span>
      <span style="display: flex; flex-direction: column; flex-grow: 1">
        <span style="font-size: 17px; font-weight: 600">Dietética Sol</span>
        <span style="font-size: 14px; color: #555B52">Rosario</span>
      </span>
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#555B52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
    </button>

    <div role="radiogroup" aria-label="Sale de" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; background: #ECE8DE; border-radius: 16px; padding: 4px">
      <button type="button" role="radio" aria-checked="{{depBB}}" onClick="{{pickBB}}" style="{{bbStyle}}">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"></path><circle cx="12" cy="9" r="2.5"></circle></svg>Bahía B.</button>
      <button type="button" role="radio" aria-checked="{{depROS}}" onClick="{{pickROS}}" style="{{rosStyle}}">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"></path><circle cx="12" cy="9" r="2.5"></circle></svg>Rosario</button>
    </div>
  </div>

  <div style="padding: 14px 20px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{items}}" as="item" hint-placeholder-count="6">
      <div style="{{item.cardStyle}}">
        <div style="display: flex; align-items: center; gap: 10px">
          <span style="{{item.monoStyle}}">{{item.mono}}</span>
          <span style="display: flex; flex-direction: column; min-width: 0">
            <span style="font-size: 15px; font-weight: 600; line-height: 1.3">{{item.name}}</span>
            <span style="font-size: 13px; color: #555B52">{{item.price}}</span>
          </span>
        </div>
        <sc-if value="{{item.selected}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; align-items: center; justify-content: space-between">
            <button type="button" aria-label="Menos" onClick="{{item.sub}}" style="width: 44px; height: 44px; border-radius: 14px; border: 0; background: #E3EBF7; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F4580" stroke-width="2.6" stroke-linecap="round"><path d="M6 12h12"></path></svg></button>
            <span style="display: flex; flex-direction: column; align-items: center; line-height: 1.1"><span style="font-size: 24px; font-weight: 700">{{item.qty}}</span><span style="font-size: 13px; color: #555B52">kg</span></span>
            <button type="button" aria-label="Más" onClick="{{item.add}}" style="width: 44px; height: 44px; border-radius: 14px; border: 0; background: #2F5DA8; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"><path d="M6 12h12M12 6v12"></path></svg></button>
          </div>
          <sc-if value="{{item.falta}}" hint-placeholder-val="{{false}}">
            <div style="display: flex; align-items: center; gap: 6px; background: #F9DAD6; color: #8C1D17; border-radius: 10px; padding: 4px 8px; font-size: 13px; font-weight: 600">
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B3261E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l9 16H3z"></path><path d="M12 10v4M12 17v.5"></path></svg>Faltan {{item.faltan}}</div>
          </sc-if>
        </sc-if>
        <sc-if value="{{item.empty}}" hint-placeholder-val="{{true}}">
          <button type="button" aria-label="Agregar" onClick="{{item.add}}" style="height: 44px; border-radius: 14px; border: 2px dashed #C9C3B4; background: transparent; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#555B52" stroke-width="2.4" stroke-linecap="round"><path d="M6 12h12M12 6v12"></path></svg></button>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 26px; background: #FFFDF8; border-top: 1px solid #E5E0D3; display: flex; align-items: center; gap: 14px">
    <div style="display: flex; flex-direction: column; flex-grow: 1; line-height: 1.2">
      <span style="font-size: 14px; color: #555B52">{{count}}</span>
      <span style="font-size: 26px; font-weight: 700">{{total}}</span>
    </div>
    <a href="Main.dc.html" style="text-decoration: none; height: 60px; padding: 0 26px; border-radius: 20px; background: #2F5DA8; color: #FFFFFF; font-size: 19px; font-weight: 600; display: flex; align-items: center; gap: 10px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>Listo</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { dep: 'ROS', qty: { P001: 25, P002: 25, P005: 10 } };
  }
  renderVals() {
    const productos = [
      { id: 'P001', mono: 'Ha', name: 'Harina integral', precio: 4080, bg: '#F1E3C0', fg: '#5C420C', stock: { BB: 120, ROS: 30 } },
      { id: 'P002', mono: 'Ma', name: 'Maní', precio: 5200, bg: '#EBD3BF', fg: '#5E3214', stock: { BB: 80, ROS: 40 } },
      { id: 'P003', mono: 'Av', name: 'Avena', precio: 2900, bg: '#E2E6CC', fg: '#434A12', stock: { BB: 200, ROS: 60 } },
      { id: 'P004', mono: 'Al', name: 'Almendras', precio: 14500, bg: '#EED7D2', fg: '#6A2519', stock: { BB: 15, ROS: 0 } },
      { id: 'P005', mono: 'Ch', name: 'Chía', precio: 6800, bg: '#D9E1EA', fg: '#263447', stock: { BB: 25, ROS: 5 } },
      { id: 'P006', mono: 'Az', name: 'Mascabo', precio: 3600, bg: '#E7DACB', fg: '#4F3A22', stock: { BB: 50, ROS: 20 } },
    ];
    const pesos = (n) => '$ ' + n.toLocaleString('es-AR');
    const dep = this.state.dep;
    const set = (id, q) => this.setState({ qty: { ...this.state.qty, [id]: Math.max(0, q) } });
    let total = 0;
    let lineas = 0;
    const items = productos.map((p) => {
      const qty = this.state.qty[p.id] || 0;
      const selected = qty > 0;
      const faltan = Math.max(0, qty - p.stock[dep]);
      total += qty * p.precio;
      if (selected) lineas += 1;
      return {
        mono: p.mono, name: p.name, price: pesos(p.precio), qty, selected, empty: !selected,
        falta: faltan > 0, faltan,
        add: () => set(p.id, qty + 5),
        sub: () => set(p.id, qty - 5),
        cardStyle: 'background: #FFFDF8; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box; border: 2px solid ' + (selected ? '#2F5DA8' : 'transparent'),
        monoStyle: 'flex-shrink: 0; width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; background: ' + p.bg + '; color: ' + p.fg,
      };
    });
    const seg = (on) => 'height: 48px; border: 0; border-radius: 12px; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; ' +
      (on ? 'background: #FFFDF8; color: #1E2420; box-shadow: 0 1px 2px rgba(30,36,32,0.15)' : 'background: transparent; color: #555B52');
    return {
      items,
      total: pesos(total),
      count: lineas + (lineas === 1 ? ' producto' : ' productos'),
      depBB: dep === 'BB' ? 'true' : 'false',
      depROS: dep === 'ROS' ? 'true' : 'false',
      bbStyle: seg(dep === 'BB'),
      rosStyle: seg(dep === 'ROS'),
      pickBB: () => this.setState({ dep: 'BB' }),
      pickROS: () => this.setState({ dep: 'ROS' }),
    };
  }
}
</script>
</body>
</html>
