<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cobrar venta</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B25E09}a:hover{color:#7A4006}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F3EC; color: #1E2420; font-family: 'Lexend', Verdana, sans-serif; font-variant-numeric: tabular-nums; line-height: 1.5">

  <header style="height: 72px; padding: 0 12px; display: flex; align-items: center; gap: 8px">
    <a href="Main.dc.html" aria-label="Volver" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1E2420" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <span style="width: 36px; height: 36px; border-radius: 12px; background: #B25E09; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="3"></circle></svg>
    </span>
    <h1 style="margin: 0; font-size: 22px; font-weight: 600">Cobrar</h1>
  </header>

  <div style="padding: 0 20px; display: flex; flex-direction: column; gap: 18px">
    <div style="background: #FFFDF8; border-radius: 18px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; min-height: 64px; box-sizing: border-box; box-shadow: 0 1px 0 #E5E0D3">
      <span style="width: 44px; height: 44px; border-radius: 22px; background: #E3EBF7; color: #1F4580; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center">DS</span>
      <span style="font-size: 17px; font-weight: 600; flex-grow: 1">Dietética Sol</span>
      <span style="display: flex; flex-direction: column; align-items: flex-end; line-height: 1.25">
        <span style="font-size: 13px; color: #555B52">Debe</span>
        <span style="font-size: 17px; font-weight: 700; color: #7A4006">$ 191.200</span>
      </span>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 8px 0">
      <label for="monto" style="font-size: 14px; color: #555B52">Recibí</label>
      <input id="monto" inputmode="numeric" value="{{monto}}" readonly style="width: 100%; box-sizing: border-box; text-align: center; border: 0; border-bottom: 3px solid #B25E09; background: transparent; font-family: inherit; font-size: 44px; font-weight: 700; color: #1E2420; padding: 4px 0; font-variant-numeric: tabular-nums; outline: none">
      <div style="display: flex; gap: 8px">
        <button type="button" onClick="{{todo}}" style="{{todoStyle}}">Todo</button>
        <button type="button" onClick="{{mitad}}" style="{{mitadStyle}}">Mitad</button>
      </div>
    </div>

    <div role="radiogroup" aria-label="Medio" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button type="button" role="radio" aria-checked="{{efOn}}" onClick="{{pickEf}}" style="{{efStyle}}">
        <svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="3"></circle><path d="M6 10v4M18 10v4"></path></svg>Efectivo</button>
      <button type="button" role="radio" aria-checked="{{trOn}}" onClick="{{pickTr}}" style="{{trStyle}}">
        <svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"></rect><path d="M10 9h4M12 7v4"></path><path d="M11 18h2"></path></svg>Transferencia</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 14px; color: #555B52">Lo tiene</span>
      <div role="radiogroup" aria-label="Lo tiene" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{socios}}" as="s" hint-placeholder-count="2">
          <button type="button" role="radio" aria-checked="{{s.on}}" onClick="{{s.pick}}" style="{{s.style}}">
            <span style="{{s.avStyle}}">{{s.ini}}</span>{{s.name}}</button>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 26px; background: #FFFDF8; border-top: 1px solid #E5E0D3">
    <a href="Main.dc.html" style="text-decoration: none; height: 60px; border-radius: 20px; background: #B25E09; color: #FFFFFF; font-size: 19px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>Cobrar {{monto}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { monto: 191200, medio: 'tr', socio: 'SOC02' };
  }
  renderVals() {
    const debe = 191200;
    const pesos = (n) => '$ ' + n.toLocaleString('es-AR');
    const { monto, medio, socio } = this.state;
    const chip = (on) => 'height: 44px; padding: 0 18px; border-radius: 22px; font-size: 15px; font-weight: 600; ' +
      (on ? 'border: 2px solid #B25E09; background: #FBEBD3; color: #7A4006' : 'border: 2px solid #D8D2C4; background: transparent; color: #1E2420');
    const big = (on) => 'height: 96px; border-radius: 20px; font-size: 15px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; ' +
      (on ? 'border: 3px solid #B25E09; background: #FBEBD3; color: #7A4006' : 'border: 3px solid transparent; background: #FFFDF8; color: #1E2420');
    const socios = [
      { id: 'SOC01', ini: 'Sa', name: 'Sampatti', av: '#E3EBF7', avFg: '#1F4580' },
      { id: 'SOC02', ini: 'GH', name: 'Guada', av: '#ECE6F6', avFg: '#4A3180' },
    ].map((s) => {
      const on = socio === s.id;
      return {
        ini: s.ini, name: s.name, on: on ? 'true' : 'false',
        pick: () => this.setState({ socio: s.id }),
        style: 'min-height: 64px; border-radius: 18px; padding: 0 12px; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 10px; ' +
          (on ? 'border: 3px solid #B25E09; background: #FBEBD3; color: #1E2420' : 'border: 3px solid transparent; background: #FFFDF8; color: #1E2420'),
        avStyle: 'width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 14px; background: ' + s.av + '; color: ' + s.avFg,
      };
    });
    return {
      monto: pesos(monto),
      todo: () => this.setState({ monto: debe }),
      mitad: () => this.setState({ monto: debe / 2 }),
      todoStyle: chip(monto === debe),
      mitadStyle: chip(monto === debe / 2),
      efOn: medio === 'ef' ? 'true' : 'false',
      trOn: medio === 'tr' ? 'true' : 'false',
      pickEf: () => this.setState({ medio: 'ef' }),
      pickTr: () => this.setState({ medio: 'tr' }),
      efStyle: big(medio === 'ef'),
      trStyle: big(medio === 'tr'),
      socios,
    };
  }
}
</script>
</body>
</html>
