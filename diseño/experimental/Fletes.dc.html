<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Fletes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6B4BA8}a:hover{color:#4A3180}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F3EC; color: #1E2420; font-family: 'Lexend', Verdana, sans-serif; font-variant-numeric: tabular-nums; line-height: 1.5">

  <header style="padding: 18px 20px 0; display: flex; align-items: center; gap: 10px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 600; flex-grow: 1">Fletes</h1>
    <button type="button" aria-label="Flete nuevo" style="width: 48px; height: 48px; border-radius: 16px; border: 0; background: #6B4BA8; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"><path d="M6 12h12M12 6v12"></path></svg></button>
  </header>

  <div style="padding: 16px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{fletes}}" as="f" hint-placeholder-count="2">
      <article style="background: #FFFDF8; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 1px 0 #E5E0D3">
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="height: 36px; padding: 0 12px; border-radius: 12px; background: #ECE8DE; font-size: 16px; font-weight: 700; display: flex; align-items: center">{{f.from}}</span>
          <svg aria-hidden="true" width="28" height="20" viewBox="0 0 28 20" fill="none" stroke="#6B4BA8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10h22M18 4l6 6-6 6"></path></svg>
          <span style="height: 36px; padding: 0 12px; border-radius: 12px; background: #ECE6F6; color: #4A3180; font-size: 16px; font-weight: 700; display: flex; align-items: center">{{f.to}}</span>
          <span style="margin-left: auto; font-size: 14px; color: #555B52">{{f.fecha}}</span>
        </div>

        <ol aria-label="Estado" style="list-style: none; margin: 0; padding: 0; display: flex; align-items: center">
          <sc-for list="{{f.steps}}" as="s" hint-placeholder-count="3">
            <sc-if value="{{s.line}}" hint-placeholder-val="{{false}}">
              <li aria-hidden="true" style="{{s.lineStyle}}"></li>
            </sc-if>
            <li aria-current="{{s.current}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 72px">
              <span style="{{s.dotStyle}}">
                <sc-if value="{{s.isPrep}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"></path><path d="M3 7l9 4 9-4"></path><path d="M12 11v10"></path></svg></sc-if>
                <sc-if value="{{s.isCamino}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h12v10H2z"></path><path d="M14 9h4l3 3v4h-7"></path><circle cx="6" cy="17" r="2"></circle><circle cx="17" cy="17" r="2"></circle></svg></sc-if>
                <sc-if value="{{s.isFin}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></sc-if>
              </span>
              <span style="{{s.labelStyle}}">{{s.label}}</span>
            </li>
          </sc-for>
        </ol>

        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <sc-for list="{{f.items}}" as="it" hint-placeholder-count="2">
            <span style="{{it.chipStyle}}"><span style="width: 28px; height: 28px; border-radius: 9px; background: #FFFDF8; display: flex; align-items: center; justify-content: center; font-size: 13px">{{it.mono}}</span>{{it.cant}}</span>
          </sc-for>
        </div>

        <sc-if value="{{f.canAdvance}}" hint-placeholder-val="{{true}}">
          <button type="button" onClick="{{f.advance}}" style="height: 56px; border: 0; border-radius: 18px; background: #6B4BA8; color: #FFFFFF; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px">
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>{{f.action}}</button>
        </sc-if>
      </article>
    </sc-for>
  </div>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #FFFDF8; border-top: 1px solid #E5E0D3; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding-bottom: 12px; box-sizing: border-box">
    <a href="Main.dc.html" style="text-decoration: none; color: #555B52; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 13px">
      <span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#555B52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg></span>Inicio</a>
    <a href="Stock.dc.html" style="text-decoration: none; color: #555B52; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 13px">
      <span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#555B52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="13" width="8" height="8" rx="1"></rect><rect x="13" y="13" width="8" height="8" rx="1"></rect><rect x="8" y="3" width="8" height="8" rx="1"></rect></svg></span>Stock</a>
    <a href="Fletes.dc.html" style="text-decoration: none; color: #1E2420; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 13px; font-weight: 600">
      <span style="width: 56px; height: 32px; border-radius: 16px; background: #1E2420; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F6F3EC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h12v10H2z"></path><path d="M14 9h4l3 3v4h-7"></path><circle cx="6" cy="17" r="2"></circle><circle cx="17" cy="17" r="2"></circle></svg></span>Fletes</a>
    <a href="Cobrar.dc.html" style="text-decoration: none; color: #555B52; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 13px">
      <span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#555B52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="3"></circle></svg></span>Caja</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { estado: { F0003: 1, F0004: 0 } };
  }
  renderVals() {
    const etapas = ['Armando', 'En viaje', 'Llegó'];
    const acciones = ['Salió', 'Llegó'];
    const fletes = [
      { id: 'F0003', from: 'BB', to: 'ROS', fecha: '15 oct', items: [['Ha', 40, '#F1E3C0', '#5C420C'], ['Ch', 10, '#D9E1EA', '#263447']] },
      { id: 'F0004', from: 'BB', to: 'ROS', fecha: '17 oct', items: [['Al', 20, '#EED7D2', '#6A2519']] },
    ];
    return {
      fletes: fletes.map((f) => {
        const e = this.state.estado[f.id];
        return {
          from: f.from, to: f.to, fecha: f.fecha,
          canAdvance: e < 2,
          action: acciones[e] || '',
          advance: () => this.setState({ estado: { ...this.state.estado, [f.id]: Math.min(2, e + 1) } }),
          items: f.items.map(([mono, cant, bg, fg]) => ({
            mono, cant,
            chipStyle: 'display: flex; align-items: center; gap: 6px; border-radius: 12px; padding: 4px 10px 4px 4px; font-size: 15px; font-weight: 600; background: ' + bg + '; color: ' + fg,
          })),
          steps: etapas.map((label, i) => {
            const done = i < e;
            const cur = i === e;
            return {
              label, line: i > 0,
              isPrep: i === 0, isCamino: i === 1, isFin: i === 2,
              current: cur ? 'step' : 'false',
              lineStyle: 'flex-grow: 1; height: 4px; border-radius: 2px; margin-bottom: 26px; background: ' + (i <= e ? '#6B4BA8' : '#D8D2C4'),
              dotStyle: 'width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; ' +
                (cur ? 'background: #6B4BA8; color: #FFFFFF; box-shadow: 0 0 0 4px #ECE6F6' : done ? 'background: #ECE6F6; color: #4A3180' : 'background: transparent; color: #8A8F84; border: 2px dashed #C9C3B4; box-sizing: border-box'),
              labelStyle: 'font-size: 13px; white-space: nowrap; ' + (cur ? 'font-weight: 700; color: #1E2420' : 'color: #555B52'),
            };
          }),
        };
      }),
    };
  }
}
</script>
</body>
</html>
