<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=360">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--verde:#0B6B3A;--blanco:#fff;--fondo:#F4F5F0;--tinta:#16201A;--apoyo:#4A554D;--amarillo:#F2B705;--azul:#1D4F91;--linea:#D5D9CF}
*{box-sizing:border-box;margin:0}
body{width:360px;height:800px;overflow:hidden;background:var(--fondo);color:var(--tinta);font:18px/1.5 "Atkinson Hyperlegible Next",Verdana,sans-serif;position:relative}
.cartel{background:var(--verde);color:var(--blanco);padding:14px 16px 16px;border-bottom:4px solid var(--blanco);outline:3px solid var(--verde)}
.cartel h1{font-size:28px;line-height:1.2;display:flex;gap:10px;align-items:center}
.ico{width:30px;height:30px;border:3px solid currentColor;border-radius:6px;display:inline-grid;place-items:center;font-size:16px}
.buscar{margin-top:12px;background:var(--blanco);color:var(--tinta);border-radius:8px;height:52px;display:flex;align-items:center;padding:0 14px;font-size:18px;color:var(--apoyo)}
.chips{display:flex;gap:8px;padding:12px 16px 4px}
.chip{height:44px;padding:0 14px;border-radius:22px;border:2px solid var(--tinta);display:grid;place-items:center;font-weight:700;font-size:16px;background:var(--blanco)}
.chip.on{background:var(--tinta);color:var(--blanco)}
.prod{margin:12px 16px 0;background:var(--blanco);border:2px solid var(--linea);border-radius:10px;overflow:hidden}
.prod h2{font-size:22px;line-height:1.3;padding:10px 14px 6px;display:flex;justify-content:space-between;align-items:baseline}
.prod h2 small{font-size:16px;font-weight:400;color:var(--apoyo)}
.fila{display:flex;justify-content:space-between;align-items:baseline;padding:6px 14px;border-top:1px solid var(--linea);font-size:18px}
.fila b{font-size:26px;font-variant-numeric:tabular-nums}
.fila.falta{background:#FFF4CC;border-left:8px solid var(--amarillo);padding-left:6px}
.aviso{display:inline-flex;gap:6px;align-items:center;font-weight:700}
.tri{width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:16px solid var(--tinta)}
.accion{position:absolute;left:16px;right:16px;bottom:84px;height:60px;border-radius:10px;background:var(--amarillo);color:var(--tinta);font-weight:700;font-size:22px;display:flex;align-items:center;justify-content:center;gap:10px;border:3px solid var(--tinta)}
nav{position:absolute;bottom:0;left:0;right:0;height:72px;background:var(--verde);display:flex}
nav a{flex:1;color:var(--blanco);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-weight:700;gap:2px}
nav a.on{background:var(--blanco);color:var(--verde)}
nav .i{width:24px;height:24px;border:3px solid currentColor;border-radius:5px}
</style></head><body>
<header class="cartel">
  <h1><span class="ico">▦</span>Stock</h1>
  <div class="buscar">Buscar producto…</div>
</header>
<div class="chips"><span class="chip on">Todos</span><span class="chip">Faltan</span><span class="chip">Rosario</span></div>
<section class="prod">
  <h2>Almendras <small>kg</small></h2>
  <div class="fila"><span>General</span><b>100</b></div>
  <div class="fila"><span>Rosario</span><b>0</b></div>
  <div class="fila"><span>En camino</span><b>60</b></div>
</section>
<section class="prod">
  <h2>Avena <small>kg</small></h2>
  <div class="fila"><span>Rosario</span><b>250</b></div>
  <div class="fila"><span>Para pedidos</span><b>100</b></div>
</section>
<section class="prod">
  <h2>Miel <small>unid.</small></h2>
  <div class="fila falta"><span class="aviso"><span class="tri"></span>Sin stock</span><b>0</b></div>
</section>
<div class="accion">＋ Pedido nuevo</div>
<nav><a><span class="i"></span>Inicio</a><a class="on"><span class="i"></span>Stock</a><a><span class="i"></span>Pedidos</a><a><span class="i"></span>Más</a></nav>
</body></html>
